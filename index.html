<!-- Inline Barcode Decoder (no external lib needed for basic) -->
<script>
/* ====== INLINE ZXING-LITE DECODER (Embedded, no external dependency) ====== */
var BarcodeDecoder = (function(){
    // Simple Code39/Code128/UPC/EAN barcode detection from image data
    function detectBarcode(canvas){
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        var imgData = ctx.getImageData(0, 0, w, h);
        var data = imgData.data;
        // Convert to grayscale and find barcode region
        var gray = new Uint8Array(w * h);
        for(var i=0;i<w*h;i++){
            var r = data[i*4], g = data[i*4+1], b = data[i*4+2];
            gray[i] = 0.299*r + 0.587*g + 0.114*b;
        }
        // Scan horizontal lines for barcode patterns
        var bestResult = null, bestScore = 0;
        var scanLines = Math.min(h, 20);
        for(var row=Math.floor(h*0.3); row<Math.floor(h*0.7); row+=Math.floor(h/scanLines)){
            var result = scanLine(gray, w, row);
            if(result && result.confidence > bestScore){
                bestScore = result.confidence;
                bestResult = result;
            }
        }
        return bestResult ? bestResult.text : null;
    }
    function scanLine(gray, w, row){
        var start = row * w;
        var bars = [];
        var inBar = false;
        var threshold = 128;
        var minBar = 3;
        for(var x=0;x<w;x++){
            var pixel = gray[start + x];
            var isDark = pixel < threshold;
            if(isDark && !inBar){ inBar = true; bars.push({start:x,width:0}); }
            if(inBar){ bars[bars.length-1].width++; }
            if(!isDark && inBar){ inBar = false; }
        }
        if(bars.length < 10) return null;
        // Try Code 128 pattern matching
        var result = tryCode128(bars, w);
        if(result) return result;
        // Try Code 39
        result = tryCode39(bars, w);
        if(result) return result;
        return null;
    }
    function tryCode128(bars, w){
        // Simplified Code 128 detection
        var patterns = {
            '11011001100':' ','11001101100':'!','11001100110':'"',
            '10010011000':'#','10010001100':'$','10001001100':'%',
            '10011001000':'&','10011000100':'\'','10001100100':'(',
            '11001001000':')','11001000100':'*','11000100100':'+',
            '10110011100':',','10011011100':'-','10011001110':'.',
            '10111001100':'/','10011101100':'0','10011100110':'1',
            '11001110010':'2','11001011100':'3','11001001110':'4',
            '11011100100':'5','11001110100':'6','11101101110':'7',
            '11101001100':'8','11100101100':'9','11100100110':':',
            '11101100100':';','11100110100':'<','11100110010':'=',
            '11011011000':'>','11011000110':'?','11000110110':'@',
            '10100011000':'A','10001011000':'B','10001000110':'C',
            '10100001000':'D','10000010110':'E','10001010000':'F',
            '10000010010':'G','10010010000':'H','10010000100':'I',
            '10000110000':'J','10000100010':'K','10000001010':'L',
            '11010111000':'M','11010111100':'N','11011101000':'O',
            '11011101100':'P','11011111000':'Q','11011111100':'R',
            '11010011100':'S','11010011110':'T','11011110100':'U',
            '11011110110':'V','11011111110':'W','11010010110':'X',
            '11010010111':'Y','11010011111':'Z','11010110100':'[',
            '11010110110':'\\','11011010100':']','11011010110':'^',
            '11011011110':'_','11011110100':'`','11011110110':'a',
            '11011111110':'b','11011111111':'c','11010111100':'d',
            '11010111110':'e','11010111111':'f','11010011100':'g',
            '11010011110':'h','11010011111':'i','11010010110':'j',
            '11010010111':'k','11010011101':'l','11010110100':'m',
            '11010110110':'n','11010110111':'o','11010111100':'p',
            '11010111110':'q','11010111111':'r','11011110100':'s',
            '11011110110':'t','11011110111':'u','11011111100':'v',
            '11011111110':'w','11011111111':'x','11010011100':'y',
            '11010011110':'z','11010011111':'{','11010010110':'|',
            '11010010111':'}','11010011101':'~'
        };
        // Simplified: look for numeric sequences
        var text = "";
        var confidence = 0;
        for(var i=2;i<bars.length-2;i+=6){
            if(i+5 >= bars.length) break;
            var total = 0;
            for(var j=0;j<6;j++) total += bars[i+j].width;
            if(total === 0) continue;
            var pattern = "";
            for(var j=0;j<6;j++){
                pattern += (bars[i+j].width / total > 0.5) ? "11" : "1";
            }
            if(patterns[pattern]){
                text += patterns[pattern];
                confidence += 10;
            }
        }
        if(text.length >= 3) return {text:text, confidence:confidence};
        return null;
    }
    function tryCode39(bars, w){
        var patterns = {
            '100010001':'0','001010000':'1','101000000':'2','000010100':'3',
            '100000100':'4','001000100':'5','000100000':'6','100100000':'7',
            '000001000':'8','100001000':'9','001001000':'A','000011000':'B',
            '100011000':'C','001011000':'D','000000010':'E','100000010':'F',
            '001000010':'G','000010010':'H','100010010':'I','000000110':'J',
            '100000110':'K','001000110':'L','000010110':'M','100010110':'N',
            '000000011':'O','100000011':'P','001000011':'Q','000010011':'R',
            '100010011':'S','000000111':'T','100000111':'U','001000111':'V',
            '000010111':'W','100010111':'X','000001011':'Y','100001011':'Z',
            '001001011':'-','000011011':'.','100011011':' ','001011011':'$',
            '000001110':'/','100001110':'+','001001110':'%'
        };
        var text = "";
        var confidence = 0;
        for(var i=1;i<bars.length-1;i+=10){
            if(i+9 >= bars.length) break;
            var total = 0;
            for(var j=0;j<9;j++) total += bars[i+j].width;
            if(total === 0) continue;
            var pattern = "";
            for(var j=0;j<9;j++){
                pattern += (bars[i+j].width / total > 0.3) ? "1" : "0";
            }
            if(patterns[pattern]){
                text += patterns[pattern];
                confidence += 15;
            }
        }
        if(text.length >= 3) return {text:text, confidence:confidence};
        return null;
    }
    return {
        detect: detectBarcode,
        fromVideo: function(video){
            var canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return detectBarcode(canvas);
        }
    };
})();
</script>

<script>
    // ====== CORE VARIABLES ======
var items = [];
var lsOK = false;
var currentPass = "admin";
var html5QrCode = null;
var nativeStream = null;
var currentFacing = "environment";
var isNativeCamera = false;

// ====== CHECK LOCALSTORAGE ======
try {
    localStorage.setItem("t", "1");
    if (localStorage.getItem("t") === "1") lsOK = true;
    localStorage.removeItem("t");
} catch (e) {
    lsOK = false;
}

function get(id) {
    return document.getElementById(id);
}

function setMsg(txt) {
    var el = get("msg");
    if (el) el.innerHTML = txt;
}

// ====== SAVE / LOAD ======
function saveData() {
    if (!lsOK) return;
    try {
        localStorage.setItem("mp_data", JSON.stringify({items: items, pass: currentPass}));
    } catch (e) {}
}

function loadData() {
    if (!lsOK) return;
    try {
        var s = localStorage.getItem("mp_data");
        if (s) {
            var d = JSON.parse(s);
            if (d.items && Array.isArray(d.items)) items = d.items;
            if (d.pass) currentPass = d.pass;
        }
    } catch (e) {
        items = [];
        currentPass = "admin";
    }
}

function resetData() {
    if (!confirm("هل أنت متأكد من مسح جميع البيانات؟")) return;
    try {
        localStorage.removeItem("mp_data");
        localStorage.removeItem("mp_theme");
    } catch (e) {}
    items = [];
    currentPass = "admin";
    alert("✅ تم مسح البيانات. أعد تحميل الصفحة.");
    location.reload();
}

// ====== NATIVE CAMERA (APK FIX) ======
function openNativeCamera() {
    try {
        isNativeCamera = true;
        var overlay = get("native-camera-overlay");
        var video = get("native-camera-video");
        var status = get("cam-status");
        overlay.style.display = "flex";
        status.innerText = "جاري طلب إذن الكاميرا...";
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.innerText = "⚠️ الكاميرا غير مدعومة في هذا الجهاز";
            setTimeout(function(){ closeNativeCamera(); openScannerFallback(); }, 2000);
            return;
        }
        
        var constraints = {
            video: {
                facingMode: currentFacing,
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        };
        
        navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
            nativeStream = stream;
            video.srcObject = stream;
            video.play();
            status.innerText = "📷 وجه الكاميرا نحو الباركود واضغط الزر الأخضر";
            
            // Auto-scan every 500ms using inline decoder
            window._scanInterval = setInterval(function(){
                if(!nativeStream || video.paused) return;
                var result = BarcodeDecoder.fromVideo(video);
                if(result){
                    status.innerText = "✅ تم قراءة: " + result;
                    get("ic").value = result;
                    setTimeout(function(){
                        closeNativeCamera();
                        get("in").focus();
                    }, 800);
                }
            }, 500);
            
        }).catch(function(err) {
            console.error("Camera error:", err);
            status.innerText = "⚠️ فشل فتح الكاميرا: " + (err.name || err.message);
            setTimeout(function(){ 
                closeNativeCamera(); 
                openScannerFallback(); 
            }, 2500);
        });
    } catch (e) {
        console.error("Native camera error", e);
        closeNativeCamera();
        openScannerFallback();
    }
}

function closeNativeCamera() {
    try {
        isNativeCamera = false;
        if(window._scanInterval) {
            clearInterval(window._scanInterval);
            window._scanInterval = null;
        }
        if(nativeStream) {
            nativeStream.getTracks().forEach(function(track){ track.stop(); });
            nativeStream = null;
        }
        var video = get("native-camera-video");
        if(video) {
            video.srcObject = null;
            video.pause();
        }
        var overlay = get("native-camera-overlay");
        if(overlay) overlay.style.display = "none";
    } catch(e) {
        console.error("Close native camera error", e);
    }
}

function flipCamera() {
    try {
        currentFacing = (currentFacing === "environment") ? "user" : "environment";
        closeNativeCamera();
        setTimeout(function(){ openNativeCamera(); }, 300);
    } catch(e) {}
}

function captureBarcode() {
    try {
        var video = get("native-camera-video");
        if(!video) return;
        var result = BarcodeDecoder.fromVideo(video);
        if(result) {
            get("cam-status").innerText = "✅ تم قراءة: " + result;

        }
    } catch(e) {
        console.error("Capture error", e);
    }
}

// ====== SCANNER (Unified Entry Point) ======
function openScanner() {
    try {
        // In APK/WebView, try native camera first
        if(window.Android && window.Android.openCamera) {
            // If Android interface exists, use it
            window.Android.openCamera();
            return;
        }
        // Otherwise try native getUserMedia
        openNativeCamera();
    } catch (e) {
        console.error("Open scanner error", e);
        openScannerFallback();
    }
}

function openScannerFallback() {
    try {
        get("scanner-modal").style.display = "flex";
        get("manual-scan").focus();
        if (typeof Html5Qrcode !== "undefined") {
            startHtml5QrCode();
        } else {
            var checkInterval = setInterval(function() {
                if (typeof Html5Qrcode !== "undefined") {
                    clearInterval(checkInterval);
                    startHtml5QrCode();
                }
            }, 500);
            setTimeout(function() {
                clearInterval(checkInterval);
                if (typeof Html5Qrcode === "undefined") {
                    console.warn("html5-qrcode not available");
                }
            }, 10000);
        }
    } catch (e) {
        console.error("Fallback scanner error", e);
    }
}

function closeScanner() {
    try {
        get("scanner-modal").style.display = "none";
        stopHtml5QrCode();
    } catch (e) {
        console.error("Close scanner error", e);
    }
}

function startHtml5QrCode() {
    try {
        if (typeof Html5Qrcode === "undefined") return;
        if (html5QrCode) {
            html5QrCode.stop().catch(function(e) { console.log("Stop error", e); });
            html5QrCode = null;
        }
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            function(decodedText, decodedResult) {
                console.log("Barcode detected:", decodedText);
                get("ic").value = decodedText;
                closeScanner();
                get("in").focus();
            },
            function(errorMessage) {}
        ).catch(function(err) {
            console.error("Start scanner error", err);
        });
    } catch (e) {
        console.error("Html5Qrcode init error", e);
    }
}

function stopHtml5QrCode() {
    try {
        if (html5QrCode) {
            html5QrCode.stop().then(function() {
                html5QrCode = null;
            }).catch(function(e) {
                html5QrCode = null;
            });
        }
    } catch (e) {
        console.error("Stop scanner error", e);
    }
}

function scanFromFile(file) {
    try {
        // Try inline decoder first (works offline)
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                var result = BarcodeDecoder.detect(canvas);
                if(result) {
                    get("ic").value = result;
                    get("in").focus();
                    alert("✅ تم قراءة الباركود: " + result);
                    return;
                }
                // Fallback to html5-qrcode if available
                if(typeof Html5Qrcode !== "undefined") {
                    var tempScanner = new Html5Qrcode("reader");
                    tempScanner.scanFile(file, false).then(function(decodedText) {
                        get("ic").value = decodedText;
                        get("in").focus();
                        alert("✅ تم قراءة الباركود: " + decodedText);
                    }).catch(function(err) {
                        alert("❌ لم يتم العثور على باركود في الصورة.");
                    });
                } else {
                    alert("❌ لم يتم العثور على باركود في الصورة.");
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    } catch (e) {
        console.error("Scan from file error", e);
        alert("❌ خطأ في مسح الصورة.");
    }
}

function manualScan(val) {
    try {
        if (val) {
            get("ic").value = val.trim();
            closeScanner();
            closeNativeCamera();
            get("in").focus();
        }
    } catch (e) {
        console.error("Manual scan error", e);
    }
}

// ====== SEARCH WITH HIGHLIGHT ======
function highlightText(text, query) {
    if (!query || !text) return text;
    var lowerText = String(text).toLowerCase();
    var lowerQuery = query.toLowerCase();
    var idx = lowerText.indexOf(lowerQuery);
    if (idx === -1) return text;
    var before = String(text).substring(0, idx);
    var match = String(text).substring(idx, idx + lowerQuery.length);
    var after = String(text).substring(idx + lowerQuery.length);
    return before + '<span class="search-highlight">' + match + '</span>' + after;
}

function renderItems() {
    try {
        if (!Array.isArray(items)) items = [];
        var searchEl = get("search-items");
        var q = searchEl ? searchEl.value.trim().toLowerCase() : "";
        var t = get("itb");
        if (!t) return;
        t.innerHTML = "";
        var shown = 0;
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (!it) continue;
            var codeMatch = it.code && String(it.code).toLowerCase().indexOf(q) !== -1;
            var nameMatch = it.name && String(it.name).toLowerCase().indexOf(q) !== -1;
            if (q && !codeMatch && !nameMatch) continue;
            shown++;
            var cls = parseFloat(it.qty || 0) <= parseFloat(it.min || 0) ? "low-stock" : "";
            var displayCode = q ? highlightText(it.code || "", q) : (it.code || "");
            var displayName = q ? highlightText(it.name || "", q) : (it.name || "");
            t.innerHTML += "<tr><td>" + displayCode + "</td><td>" + displayName + "</td><td>" + (it.sell || 0) + " د.ت</td><td class=\"" + cls + "\">" + (it.qty || 0) + " " + (it.unit || "قطعة") + "</td><td><button class=\"btn-red\" onclick=\"delItem(" + i + ")\">حذف</button></td></tr>";
        }
        if (shown === 0 && q) {
            t.innerHTML = '<tr><td colspan="5" class="empty">لا توجد نتائج لـ "' + q + '"</td></tr>';
        }
    } catch (e) {
        console.error("Render items error", e);
    }
}

function delItem(i) {
    try {
        if (!confirm("حذف المادة؟")) return;
        items.splice(i, 1);
        saveData();
        renderItems();
    } catch (e) {
        console.error("Delete item error", e);
    }
}

function renderMissing() {
    try {
        if (!Array.isArray(items)) items = [];
        var t = get("mtb");
        if (!t) return;
        t.innerHTML = "";
        var c = 0;
        for (var i = 0; i < items.length; i++) {

            }

function importData(file) {
    try {
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var content = e.target.result;
                var ext = file.name.split(".").pop().toLowerCase();
                if (ext === "json") {
                    var data = JSON.parse(content);
                    if (data.items && Array.isArray(data.items)) {
                        if (confirm("سيتم استبدال " + items.length + " مادة بـ " + data.items.length + " مادة. متأكد؟")) {
                            items = data.items;
                            saveData();
                            renderItems();
                            alert("✅ تم استيراد " + data.items.length + " مادة بنجاح!");
                        }
                    } else {
                        alert("❌ ملف JSON غير صالح!");
                    }
                } else if (ext === "csv") {
                    importCSV(content);
                } else {
                    alert("❌ صيغة الملف غير مدعومة. استخدم JSON أو CSV.");
                }
            } catch (err) {
                alert("❌ خطأ في قراءة الملف: " + err.message);
            }
        };
        reader.readAsText(file);
    } catch (e) {
        alert("خطأ في الاستيراد: " + e.message);
    }
}

function importCSV(csvText) {
    try {
        var lines = csvText.replace(/\uFEFF/g, "").split("\n");
        var newItems = [];
        for (var i = 1; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            var parts = line.split(',');
            if (parts.length < 2) continue;
            newItems.push({
                code: parts[0] ? parts[0].trim().replace(/^"|"$/g, '') : '',
                name: parts[1] ? parts[1].trim().replace(/^"|"$/g, '') : '',
                buy: parseFloat(parts[2]) || 0,
                sell: parseFloat(parts[3]) || 0,
                min: parseFloat(parts[4]) || 0,
                qty: parseFloat(parts[5]) || 0,
                unit: parts[6] ? parts[6].trim().replace(/^"|"$/g, '') : 'قطعة'
            });
        }
        if (newItems.length === 0) { alert("❌ لا توجد بيانات صالحة في ملف CSV!"); return; }
        if (confirm("سيتم استبدال " + items.length + " مادة بـ " + newItems.length + " مادة. متأكد؟")) {
            items = newItems;
            saveData();
            renderItems();
            alert("✅ تم استيراد " + newItems.length + " مادة من CSV بنجاح!");
        }
    } catch (e) {
        alert("❌ خطأ في استيراد CSV: " + e.message);
    }
}

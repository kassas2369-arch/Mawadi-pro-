<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mawadi-Pro ERP - نظام إدارة المخزون المتكامل</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1f36">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --bg: #f0f2f8; --surface: #ffffff; --surface2: #f7f8fc; --surface3: #eef0f8;
  --primary: #3d5af1; --primary-dark: #2a40d4; --primary-light: #e8ecfd;
  --accent: #22c55e; --danger: #ef4444; --warning: #f59e0b; --info: #0ea5e9; --purple: #8b5cf6;
  --text: #1a1f36; --text2: #4a5568; --text3: #9aa3b5;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
  --shadow: 0 2px 12px rgba(61,90,241,0.08); --shadow2: 0 8px 32px rgba(61,90,241,0.14);
  --radius: 14px; --radius-sm: 8px; --radius-lg: 20px;
}
body.dark {
  --bg: #0f1117; --surface: #1a1d2e; --surface2: #1f2235; --surface3: #252840;
  --primary: #4f6ef7; --primary-dark: #3d5af1; --primary-light: #1e2445;
  --text: #e8eaf6; --text2: #9aa3c8; --text3: #5c6380;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --shadow: 0 2px 12px rgba(0,0,0,0.4); --shadow2: 0 8px 32px rgba(0,0,0,0.5);
}
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
#loginPage { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1f36 0%, #3d5af1 50%, #22c55e 100%); padding: 20px; position: relative; overflow: hidden; }
#loginPage::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; animation: float 20s linear infinite; }
@keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }
.login-card { background: var(--surface); border-radius: var(--radius-lg); padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 32px 80px rgba(0,0,0,0.3); text-align: center; position: relative; z-index: 1; }
.login-logo { width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 36px; box-shadow: 0 8px 24px rgba(61,90,241,0.3); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.login-title { font-size: 26px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
.login-sub { font-size: 14px; color: var(--text3); margin-bottom: 32px; }
.field-group { margin-bottom: 18px; text-align: right; }
.field-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.field-group input { width: 100%; padding: 14px 18px; border: 2px solid var(--border2); border-radius: var(--radius-sm); font-family: 'Cairo', sans-serif; font-size: 15px; background: var(--surface2); color: var(--text); transition: all 0.2s; outline: none; }
.field-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(61,90,241,0.12); }
.btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; box-shadow: 0 4px 16px rgba(61,90,241,0.3); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(61,90,241,0.4); }
.btn-primary:active { transform: scale(0.98); }
#appPage { display: none; min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; cursor: pointer; border: 2px solid var(--border2); transition: transform 0.2s; }
.brand-logo:hover { transform: scale(1.1); }
.brand-name { font-size: 18px; font-weight: 800; color: var(--text); }
.brand-name span { color: var(--primary); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; color: var(--text2); }
.icon-btn:hover { background: var(--primary-light); color: var(--primary); transform: translateY(-2px); }
.nav-tabs { display: flex; gap: 8px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: 64px; z-index: 99; }
.nav-tab { padding: 8px 16px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.nav-tab:hover { background: var(--surface2); }
.nav-tab.active { background: var(--primary-light); color: var(--primary); }
.content { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform 0.2s; position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.stat-card:hover { transform: translateY(-2px); }
.stat-card:nth-child(1)::before { background: var(--primary); }
.stat-card:nth-child(2)::before { background: var(--accent); }
.stat-card:nth-child(3)::before { background: var(--warning); }
.stat-card:nth-child(4)::before { background: var(--danger); }
.stat-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 900; color: var(--primary); line-height: 1; }
.stat-value.green { color: var(--accent); }
.stat-value.orange { color: var(--warning); }
.stat-value.red { color: var(--danger); }
.stat-trend { font-size: 11px; margin-top: 6px; font-weight: 600; }
.stat-trend.up { color: var(--accent); }
.stat-trend.down { color: var(--danger); }
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; transition: box-shadow 0.2s; }
.card:hover { box-shadow: var(--shadow2); }
.card-header { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-title { font-size: 15px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px 20px 20px; }
.charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
.chart-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px; }
.chart-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px; text-align: center; }
.chart-container { position: relative; height: 250px; }
.ai-insights { background: linear-gradient(135deg, var(--primary-light), var(--surface)); border: 1px solid var(--primary); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.ai-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ai-icon { font-size: 24px; animation: sparkle 2s ease-in-out infinite; }
@keyframes sparkle { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.2) rotate(10deg); } }
.ai-title { font-size: 16px; font-weight: 800; color: var(--primary); }
.ai-content { font-size: 13px; color: var(--text2); line-height: 1.8; }
.ai-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.ai-item:last-child { border-bottom: none; }
#reader { display: none; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--primary); margin-bottom: 16px; background: #000; }
.input-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.inp { flex: 1; min-width: 120px; padding: 11px 16px; border: 1.5px solid var(--border2); border-radius: var(--radius-sm); font-family: 'Cairo', sans-serif; font-size: 13px; background: var(--surface2); color: var(--text); outline: none; transition: all 0.2s; }
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61,90,241,0.1); }
select.inp { cursor: pointer; }
.btn { padding: 10px 18px; border: none; border-radius: var(--radius-sm); font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn-blue { background: var(--primary); color: #fff; }
.btn-blue:hover { background: var(--primary-dark); }
.btn-green { background: var(--accent); color: #fff; }
.btn-green:hover { opacity: 0.9; }
.btn-red { background: var(--danger); color: #fff; }
.btn-red:hover { opacity: 0.9; }
.btn-yellow { background: var(--warning); color: #fff; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-info { background: var(--info); color: #fff; }
.btn-gray { background: var(--surface3); color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { background: var(--surface3); }
.btn-lg { width: 100%; justify-content: center; padding: 14px; font-size: 14px; border-radius: var(--radius-sm); margin-top: 4px; }
.search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.search-bar .inp { flex: 1; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--primary); color: #fff; padding: 12px 14px; font-weight: 700; font-size: 12px; text-align: center; white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 11px 14px; text-align: center; color: var(--text); font-size: 13px; }
.code-badge { display: inline-block; background: var(--primary-light); color: var(--primary); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 700; font-family: monospace; }
.sup-badge { display: inline-block; background: var(--surface3); color: var(--text2); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
.qty-wrap { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 2px; }
.qty-btn { width: 28px; height: 28px; border-radius: 6px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; line-height: 1; }
.qty-minus { background: #fee2e2; color: var(--danger); }
.qty-plus { background: #dcfce7; color: var(--accent); }
.qty-minus:hover { background: #fecaca; }
.qty-plus:hover { background: #bbf7d0; }
.qty-num { min-width: 32px; text-align: center; font-weight: 800; font-size: 14px; color: var(--text); }
.tbl-actions { display: flex; gap: 4px; justify-content: center; }
.tbl-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s; }
.tbl-btn:hover { transform: scale(1.1); }
.tbl-edit { background: #fef3c7; }
.tbl-del { background: #fee2e2; }
#supplierPdfPage { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 1000; overflow-y: auto; }
.page-topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
.page-title { font-size: 16px; font-weight: 800; flex: 1; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 20px; }
.printable-area { background: white; width: 210mm; min-height: 290mm; margin: 0 auto 20px; padding: 18mm; box-sizing: border-box; color: black !important; }
.pdf-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #3d5af1; padding-bottom: 16px; margin-bottom: 24px; }
.pdf-logo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; }
.pdf-shop { font-size: 22px; font-weight: 800; color: #3d5af1; margin-bottom: 4px; }
.pdf-date { font-size: 12px; color: #666; }
.pdf-banner { text-align: center; background: #3d5af1; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 16px; font-weight: 700; }
.pdf-sup { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 12px; padding: 8px 12px; background: #f0f2f8; border-radius: 6px; border-right: 4px solid #3d5af1; }
.pdf-table { width: 100%; border-collapse: collapse; }
.pdf-table th { background: #f0f2f8 !important; color: #1a1f36 !important; border: 1px solid #ddd; padding: 10px; font-size: 13px; }
.pdf-table td { border: 1px solid #ddd; padding: 10px; font-size: 13px; color: #333 !important; }
.pdf-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
.pdf-stat-box { background: #f0f2f8; border-radius: 8px; padding: 12px; text-align: center; }
.pdf-stat-value { font-size: 20px; font-weight: 800; color: #3d5af1; }
.pdf-stat-label { font-size: 11px; color: #666; margin-top: 4px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 13px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--primary); color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow2); z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; display: flex; align-items: center; gap: 8px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.green { background: var(--accent); }
.toast.red { background: var(--danger); }
.toast.warning { background: var(--warning); }
.badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-success { background: #dcfce7; color: #166534; }
.badge-warning { background: #fef3c7; color: #92400e; }
.badge-danger { background: #fee2e2; color: #991b1b; }
.report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.report-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; cursor: pointer; transition: all 0.2s; }
.report-card:hover { transform: translateY(-4px); box-shadow: var(--shadow2); border-color: var(--primary); }
.report-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px; }
.report-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
.report-desc { font-size: 12px; color: var(--text3); }
.shop-edit-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.invoice-items { max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 12px; }
.invoice-item-row { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
.invoice-item-row:last-child { border-bottom: none; }
.invoice-total { background: var(--primary-light); padding: 16px; border-radius: var(--radius-sm); text-align: center; font-size: 18px; font-weight: 800; color: var(--primary); margin-top: 12px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow2); }
.modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 16px; font-weight: 800; }
.modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--surface2); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.category-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--surface3); color: var(--text2); }
@media (max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .charts-grid { grid-template-columns: 1fr; } .topbar { padding: 0 12px; } .content { padding: 16px 10px; } .printable-area { width: 100%; padding: 12px; } .nav-tabs { padding: 8px 10px; } }
@media (max-width: 540px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .stat-card:nth-child(3), .stat-card:nth-child(4) { grid-column: span 2; } }
@media print { body { background: white; } #supplierPdfPage { position: static; } .page-topbar, .page-actions { display: none; } .printable-area { box-shadow: none; border: none; } }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOGIN PAGE -->
<div id="loginPage" style="display:flex">
  <div class="login-card">
    <div class="login-logo">📦</div>
    <div class="login-title">Mawadi-Pro ERP</div>
    <div class="login-sub">نظام إدارة المخزون المتكامل بالذكاء الاصطناعي</div>
    <div class="field-group">
      <label>المستخدم</label>
      <input id="user" placeholder="أدخل اسم المستخدم" autocomplete="username">
    </div>
    <div class="field-group">
      <label>كلمة المرور</label>
      <input id="pass" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn-primary" onclick="login()">تسجيل الدخول</button>
    <div style="margin-top:12px;font-size:12px;color:var(--text3);cursor:pointer" onc
